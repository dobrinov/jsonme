default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: jsonme_development

test:
  <<: *default
  database: jsonme_test

production:
  <<: *default
  database: jsonme_production
  username: jsonme
  password: <%= ENV['JSONME_DATABASE_PASSWORD'] %>
