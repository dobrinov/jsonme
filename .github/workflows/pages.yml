name: Project page

# Publishes me/site/ to https://dobrinov.github.io/jsonme/, with the builder modules that /write/ runs in the browser.
on:
  push:
    branches: [main]
    paths: ['me/site/**', 'me/src/**', 'me/template/me.json', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh me/site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: me/_pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
